version: "3.8"

# =====================================================
# VINAACADEMY DOCKER SWARM STACK
# =====================================================
# Node Setup:
# - vina-tools (2GB RAM): infrastructure services (redis, kafka)
# - vina-microservices (8GB RAM): application services
#
# External Services (Cloud):
# - PostgreSQL: Use cloud provider (e.g., AWS RDS, Azure Database, Supabase)
# - MinIO/S3: Use cloud storage (e.g., AWS S3, MinIO Cloud, Cloudflare R2)
#
# Label nodes before deploying:
# docker node update --label-add role=tools vina-tools
# docker node update --label-add role=worker-service vina-microservices
#
# IMPORTANT: Docker Stack does NOT support .env files automatically!
# You must export environment variables before deploying:
#
# Option 1: Export from .env file (Linux/Mac)
#   export $(grep -v '^#' .env | xargs) && docker stack deploy -c docker-stack.yml vinaacademy
#
# Option 2: Export from .env file (Windows PowerShell)
#   Get-Content .env | ForEach-Object { if ($_ -match '^([^#][^=]*)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2]) } }
#   docker stack deploy -c docker-stack.yml vinaacademy
#
# Option 3: Use docker-compose config to substitute variables
#   docker-compose -f docker-stack.yml config | docker stack deploy -c - vinaacademy
# =====================================================

networks:
  vinaacademy-network:
    driver: overlay
    attachable: true

volumes:
  redis_data:
    driver: local
  kafka_data:
    driver: local

configs:
  api-gateway-config:
    file: ./app-config/dev/api-gateway-dev.yml
  vinaacademy-platform-config:
    file: ./app-config/dev/vinaacademy-platform-dev.yml
  notification-service-config:
    file: ./app-config/dev/notification-service-dev.yml
  chat-service-config:
    file: ./app-config/dev/chat-service-dev.yml
  text-to-speech-service-config:
    file: ./app-config/dev/text-to-speech-service-dev.yml

secrets:
  private_key:
    file: ./keys/private_key.pem
  public_key:
    file: ./keys/public_key.pem

services:
  # =====================================================
  # INFRASTRUCTURE SERVICES (Deploy on vina-tools - 2GB RAM)
  # =====================================================

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vinaacademy-network
    volumes:
      - redis_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == tools
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"
    networks:
      - vinaacademy-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == tools
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # APPLICATION SERVICES (Deploy on vina-microservices - 8GB RAM)
  # =====================================================

  eureka-server:
    image: lochuung/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - vinaacademy-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker-service
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-gateway:
    image: lochuung/api-gateway:latest
    ports:
      - target: 8080
        published: 8080
        mode: host
    networks:
      - vinaacademy-network
    configs:
      - source: api-gateway-config
        target: /config/api-gateway-dev.yml
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/api-gateway-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker-service
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  vinaacademy-platform:
    image: lochuung/vinaacademy-platform:latest
    ports:
      - "8081:8080"
      - "9090:9090"
    networks:
      - vinaacademy-network
    configs:
      - source: vinaacademy-platform-config
        target: /config/vinaacademy-platform-dev.yml
    secrets:
      - source: private_key
        target: /app/keys/private_key.pem
      - source: public_key
        target: /app/keys/public_key.pem
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/vinaacademy-platform-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=${POSTGRES_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - APPLICATION_HMAC_SECRET=${APPLICATION_HMAC_SECRET}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker-service
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  notification-service:
    image: lochuung/notification-service:latest
    ports:
      - "8082:8080"
    networks:
      - vinaacademy-network
    configs:
      - source: notification-service-config
        target: /config/notification-service-dev.yml
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/notification-service-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=${POSTGRES_NOTIFICATION_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - SECURITY_JWT_GRPC_ADDRESS=vinaacademy-platform:9090
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - APPLICATION_HMAC_SECRET=${APPLICATION_HMAC_SECRET}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker-service
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  chat-service:
    image: lochuung/chat-service:latest
    ports:
      - "8083:8080"
    networks:
      - vinaacademy-network
    configs:
      - source: chat-service-config
        target: /config/chat-service-dev.yml
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/chat-service-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=${POSTGRES_CHAT_HOST}
      - DB_NAME=${POSTGRES_CHAT_DB}
      - DB_USERNAME=${POSTGRES_USERNAME}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICE_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SECURITY_JWT_GRPC_ADDRESS=vinaacademy-platform:9090
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker-service
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  text-to-speech-service:
    image: lphn319/text-to-speech-service:latest
    ports:
      - "8084:8080"
    networks:
      - vinaacademy-network
    configs:
      - source: text-to-speech-service-config
        target: /config/text-to-speech-service-dev.yml
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/text-to-speech-service-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-southeastasia}
      - AZURE_SPEECH_ENDPOINT=${AZURE_SPEECH_ENDPOINT:-https://southeastasia.api.cognitive.microsoft.com/}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-vi-VN-HoaiMyNeural}
      - TTS_DEFAULT_LANGUAGE=${TTS_DEFAULT_LANGUAGE:-vi-VN}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker-service
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  vinaacademy-frontend:
    image: lochuung/vinaacademy-frontend:latest
    ports:
      - target: 3000
        published: 3000
        mode: host
    networks:
      - vinaacademy-network
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api-gateway:8080/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == worker-service
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
