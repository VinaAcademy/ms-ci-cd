# Gateway Security Configuration
gateway:
  security:
    rate-limit:
      enabled: true
      max-requests-per-minute: 200
      redis-key-prefix: "rate_limit:"
      exceptions:
        ips:
          - "127.0.0.1"
          - "10.104.0.0/16"
          - "172.19.0.0/16"
        paths:
          - "/api/v1/courses/by-slug/**"


spring:
  application:
    name: api-gateway
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:erfniewrufn23u4jknedfs89!asf3}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: DedupeResponseHeader
              args:
                strategy: RETAIN_FIRST
                name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: 10
                redis-rate-limiter.burst-capacity: 20
                key-resolver: "#{@ipKeyResolver}"
            - name: RequestSize
              args:
                maxSize: 10MB
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:[*]"
                  - "https://vnacademy.io.vn"
                  - "https://*.vnacademy.io.vn"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            # WebSocket route for STOMP connections (SockJS enabled)
            - id: chat-websocket
              uri: lb:ws://CHAT-SERVICE
              predicates:
                - Path=/ws/chat/**
              filters:
                - name: PreserveHostHeader
                - RemoveRequestHeader=Sec-WebSocket-Protocol

            # Chat REST API routes
            - id: chat-api
              uri: lb://CHAT-SERVICE
              predicates:
                - Path=/api/v1/conversations/**, /api/v1/messages/**, /api/v1/chat/**


            - id: notification-websocket
              uri: lb:ws://NOTIFICATION-SERVICE
              predicates:
                - Path=/ws/notification/**
              filters:
                - name: PreserveHostHeader
                - RemoveRequestHeader=Sec-WebSocket-Protocol

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**

            # Text-to-Speech Service routes
            - id: tts-service
              uri: lb://TEXT-TO-SPEECH-SERVICE
              predicates:
                - Path=/api/v1/tts/**

            # Lang-AI Service routes (direct routing without Eureka)
            - id: lang-ai-service
              uri: http://lang-ai-service:8085
              predicates:
                - Path=/api/v1/language/**
              metadata:
                connect-timeout: 5000
                response-timeout: 30s

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/v1/ai/quiz/**
              filters:
                - RewritePath=/api/v1/ai/quiz/?(?<remaining>.*), /api/v1/quiz/${remaining}
              metadata:
                connect-timeout: 5000
                response-timeout: 180s

            # 💡 Cấu hình fallback cho các route chưa tách khỏi monolith
            - id: platform-fallback
              uri: lb://VINAACADEMY-PLATFORM
              predicates:
                - Path=/api/v1/**

          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
  main:
    web-application-type: reactive


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICE_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
