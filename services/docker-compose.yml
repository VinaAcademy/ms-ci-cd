version: '3.8'

networks:
  vinaacademy-network:
    driver: bridge
    name: vinaacademy-network

services:
  api-gateway:
    restart: unless-stopped
    image: lochuung/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - vinaacademy-network
    volumes:
      - ../app-config/dev:/config
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/api-gateway-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=${DROPLET_A_IP}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_CLIENT_SERVICE_DEFAULTZONE=http://${DROPLET_A_IP}:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  vinaacademy-platform:
    restart: unless-stopped
    image: lochuung/vinaacademy-platform:latest
    container_name: vinaacademy-platform
    ports:
      - "8081:8080"
      - "9090:9090"
    networks:
      - vinaacademy-network
    volumes:
      - ../app-config/dev:/config
      - ../keys:/app/keys
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/vinaacademy-platform-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=${PLATFORM_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${DROPLET_A_IP}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_CLIENT_SERVICE_DEFAULTZONE=http://${DROPLET_A_IP}:8761/eureka/
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-vinaacademy}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_URL_RETURN=${VNPAY_URL_RETURN:-http://${DROPLET_A_IP}:3000/transaction}
      - APPLICATION_HMAC_SECRET=${APPLICATION_HMAC_SECRET}
      - APPLICATION_URL_FRONTEND=${APPLICATION_URL_FRONTEND:-http://localhost:3000}
      - APPLICATION_URL_BACKEND=${APPLICATION_URL_BACKEND:-http://localhost:8080}
      - KAFKA_BOOTSTRAP_SERVERS=${DROPLET_A_IP}:9092
      - LANGAI_SERVICE_URL=http://lang-ai-service:8085
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  notification-service:
    restart: unless-stopped
    image: lochuung/notification-service:latest
    container_name: notification-service
    ports:
      - "8082:8082"
    networks:
      - vinaacademy-network
    volumes:
      - ../app-config/dev:/config
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/notification-service-dev.yml
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=${NOTIFICATION_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${DROPLET_A_PUBLIC_IP}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${DROPLET_A_PUBLIC_IP}:29092
      - EUREKA_CLIENT_SERVICE_DEFAULTZONE=${EUREKA_CLIENT_SERVICE_DEFAULTZONE:-http://${DROPLET_A_PUBLIC_IP}:8761/eureka/}
      - EUREKA_INSTANCE_IP_ADDRESS=${NOTIFICATION_SERVICE_IP_ADDRESS:-localhost}
      - SECURITY_EUREKA_ENABLED=false
      - SECURITY_OAUTH2_TOKEN_URI=${SECURITY_OAUTH2_TOKEN_URI:-http://vinaacademy-platform:8080/oauth2/token}
      - SECURITY_JWT_GRPC_ADDRESS=${SECURITY_JWT_GRPC_ADDRESS:-vinaacademy-platform:9090}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - APPLICATION_HMAC_SECRET=${APPLICATION_HMAC_SECRET}
      - APPLICATION_URL_FRONTEND=${APPLICATION_URL_FRONTEND:-http://localhost:3000}
      - APPLICATION_URL_BACKEND=${APPLICATION_URL_BACKEND:-http://localhost:8080}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  chat-service:
    restart: unless-stopped
    image: lochuung/chat-service:latest
    container_name: chat-service
    depends_on:
      vinaacademy-platform:
        condition: service_healthy
    ports:
      - "8083:8080"
    networks:
      - vinaacademy-network
    volumes:
      - ../app-config/dev:/config
    environment:
      - SPRING_CONFIG_LOCATION=file:/config/chat-service-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=${CHAT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${DROPLET_A_IP}:9092
      - EUREKA_CLIENT_SERVICE_DEFAULTZONE=http://${DROPLET_A_IP}:8761/eureka/
      - SECURITY_JWT_GRPC_ADDRESS=vinaacademy-platform:9090
      - SPRING_DATA_REDIS_HOST=${DROPLET_A_IP}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  vinaacademy-frontend:
    restart: unless-stopped
    image: lochuung/vinaacademy-frontend:latest
    container_name: vinaacademy-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
      vinaacademy-platform:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - vinaacademy-network
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api-gateway:8080/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}

  text-to-speech-service:
    restart: unless-stopped
    image: lphn319/text-to-speech-service:latest
    container_name: text-to-speech-service
    ports:
      - "8084:8084"
    networks:
      - vinaacademy-network
    volumes:
      - ../app-config/dev:/config
    environment:
      - SERVER_PORT=8084
      - SPRING_CONFIG_LOCATION=file:/config/text-to-speech-service-dev.yml
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=${DROPLET_A_IP}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://${DROPLET_A_IP}:8761/eureka/
      - EUREKA_INSTANCE_IP_ADDRESS=${TEXT_TO_SPEECH_SERVICE_IP_ADDRESS:-localhost}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-southeastasia}
      - AZURE_SPEECH_ENDPOINT=${AZURE_SPEECH_ENDPOINT:-https://eastus.api.cognitive.microsoft.com/}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE}
      - TTS_DEFAULT_LANGUAGE=${TTS_DEFAULT_LANGUAGE}
      - TTS_AUDIO_FORMAT=${TTS_AUDIO_FORMAT}
      - TTS_MAX_TEXT_LENGTH=${TTS_MAX_TEXT_LENGTH}
      - TTS_CACHE_ENABLED=${TTS_CACHE_ENABLED}

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  lang-ai-service:
    restart: unless-stopped
    image: lphn319/lang-ai-service:latest
    container_name: lang-ai-service
    ports:
      - "8085:8085"
    networks:
      - vinaacademy-network
    environment:
      - SERVER_PORT=8085
      - SERVER_HOST=0.0.0.0
      - AZURE_LANGUAGE_ENDPOINT=${AZURE_LANGUAGE_ENDPOINT}
      - AZURE_LANGUAGE_API_KEY=${AZURE_LANGUAGE_API_KEY}
      - AZURE_REGION=${AZURE_REGION:-southeastasia}
      - LOG_LEVEL=info
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
