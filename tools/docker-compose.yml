version: '3.8'

networks:
  vinaacademy-network:
    driver: bridge
    name: vinaacademy-network

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vinaacademy}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    networks:
      - vinaacademy-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ../scripts/ensure-dbs.sh:/docker-entrypoint-initdb.d/02-ensure-dbs.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Sidecar to ensure databases exist on every restart
  postgres-init:
    image: pgvector/pgvector:pg16
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vinaacademy-network
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-vinaacademy}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vinaacademy}
    volumes:
      - ../scripts/ensure-dbs.sh:/ensure-dbs.sh
    entrypoint: ["/bin/bash", "/ensure-dbs.sh"]
    restart: "no"

  eureka-server:
    restart: unless-stopped
    image: lochuung/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - vinaacademy-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - vinaacademy-network
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    restart: unless-stopped
    image: apache/kafka:3.9.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${DROPLET_A_IP}:9092,EXTERNAL://${DROPLET_A_PUBLIC_IP}:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${DROPLET_A_IP}:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 524288000
      KAFKA_MESSAGE_MAX_BYTES: 524288000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 524288000  
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
    networks:
      - vinaacademy-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 30s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  kafka_data:
    driver: local